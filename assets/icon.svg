<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background dark modern rounded container -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>

    <!-- File sheet gradient -->
    <linearGradient id="fileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242C3D" />
      <stop offset="100%" stop-color="#191F2C" />
    </linearGradient>

    <!-- Timeline gradient (Cyan to Blue) -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Event pulse accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base rounded container -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)" stroke="#2E384D" stroke-width="3" />

  <!-- File Outline (Folder / Document Sheet with folded corner) -->
  <path d="M 68 56 
           L 144 56 
           L 188 100 
           L 188 200 
           C 188 204.4 184.4 208 180 208 
           L 76 208 
           C 71.6 208 68 204.4 68 200 
           Z" 
        fill="url(#fileGrad)" 
        stroke="#3B4863" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Folded corner tab -->
  <path d="M 144 56 
           L 144 96 
           C 144 98.2 145.8 100 148 100 
           L 188 100" 
        fill="#1C2331" 
        stroke="#3B4863" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Timeline Axis (Vertical thread representing file lifecycle) -->
  <line x1="102" y1="92" x2="102" y2="182" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
  <line x1="102" y1="92" x2="102" y2="182" stroke="url(#cyanGlow)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Lifecycle Event 1: Create / Origin (Cyan) -->
  <circle cx="102" cy="104" r="5" fill="#38BDF8" filter="url(#glow)" />
  <line x1="102" y1="104" x2="152" y2="104" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" />
  <rect x="134" y="99" width="28" height="10" rx="3" fill="#38BDF8" opacity="0.9" />

  <!-- Lifecycle Event 2: Modifications / Kernel Activity Pulse (Purple / Neon Blue) -->
  <path d="M 102 136 
           L 116 136 
           L 123 124 
           L 132 148 
           L 139 132 
           L 145 136 
           L 162 136" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
  <circle cx="102" cy="136" r="6" fill="#818CF8" stroke="#141824" stroke-width="2" />

  <!-- Lifecycle Event 3: Verification / Checkpoint (Emerald Green) -->
  <circle cx="102" cy="168" r="5" fill="#34D399" filter="url(#glow)" />
  <line x1="102" y1="168" x2="156" y2="168" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" />
  <rect x="126" y="163" width="34" height="10" rx="3" fill="#34D399" opacity="0.85" />
</svg>
